# ld65 config: rebuild Contra (USA) byte-identical
# Header + 8 x 16KB PRG banks, written sequentially to %O in MEMORY order.
MEMORY {
    HDR:  file = %O, start = $0000, size = $0010, fill = yes;
    B0:   file = %O, start = $8000, size = $4000, fill = yes, fillval = $FF;
    B1:   file = %O, start = $8000, size = $4000, fill = yes, fillval = $FF;
    B2:   file = %O, start = $8000, size = $4000, fill = yes, fillval = $FF;
    B3:   file = %O, start = $8000, size = $4000, fill = yes, fillval = $FF;
    B4:   file = %O, start = $8000, size = $4000, fill = yes, fillval = $FF;
    B5:   file = %O, start = $8000, size = $4000, fill = yes, fillval = $FF;
    B6:   file = %O, start = $8000, size = $4000, fill = yes, fillval = $FF;
    B7:   file = %O, start = $C000, size = $4000, fill = yes, fillval = $FF;
}
SEGMENTS {
    HEADER: load = HDR, type = ro;
    BANK0:  load = B0,  type = ro;
    BANK1:  load = B1,  type = ro;
    BANK2:  load = B2,  type = ro;
    BANK3:  load = B3,  type = ro;
    BANK4:  load = B4,  type = ro;
    BANK5:  load = B5,  type = ro;
    BANK6:  load = B6,  type = ro;
    BANK7:  load = B7,  type = ro;
}
