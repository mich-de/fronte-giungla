<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fronte Giungla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen arcade cabinet; pixel canvas centred, touch controls float over the lower corners */
:root{
  --bg:#05060d; --ink:#f4efe1; --red:#e8402a; --steel:#9fb0c8; --gold:#ffcf4a;
  --glass:rgba(244,239,225,.10); --line:rgba(244,239,225,.30);
  --px:"Press Start 2P", ui-monospace, monospace;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--px);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
#hint{display:none;margin:0;font-size:8px;line-height:1.8;color:var(--steel);text-align:center;padding:0 16px;max-width:34ch}
@media (orientation:portrait){
  #app{justify-content:flex-start;padding-top:7vh}
  body.touch #hint{display:block}
}
.ctl{display:none}
body.touch #pad{display:block}
body.touch #btns{display:flex}
#pad{position:absolute;left:0;bottom:0;width:50%;height:72%;z-index:2;touch-action:none}
#stick{position:absolute;width:118px;height:118px;margin:-59px 0 0 -59px;border-radius:50%;border:2px solid var(--line);background:var(--glass);pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(244,239,225,.28);border:2px solid rgba(244,239,225,.45)}
#btns{position:absolute;z-index:3;gap:14px;align-items:flex-end;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.pb{width:76px;height:76px;border-radius:50%;border:2px solid var(--line);background:rgba(232,64,42,.26);color:var(--ink);font:16px/1 var(--px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;touch-action:none;padding:0}
.pb small{font-size:6px;letter-spacing:.1em;opacity:.8}
.pb.on{background:rgba(232,64,42,.62);transform:scale(.94)}
#bA{margin-bottom:40px;background:rgba(255,207,74,.18)}
#bA.on{background:rgba(255,207,74,.5)}
#top{position:absolute;z-index:4;top:calc(8px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));display:flex;gap:8px}
.tb{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:rgba(5,6,13,.55);color:var(--ink);font:10px/1 var(--px);padding:0}
.tb[aria-pressed="true"]{color:var(--red)}
.tb svg{display:block;margin:auto}
.tb.dbg{color:var(--gold);border-color:rgba(255,207,74,.5)}
button{cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<div id="app">
  <canvas id="cv" aria-label="Fronte Giungla: gioco d'azione a scorrimento"></canvas>
  <p id="hint">Gira il telefono in orizzontale per giocare a schermo pieno</p>
  <div id="pad" class="ctl"><div id="stick"><div id="knob"></div></div></div>
  <div id="btns" class="ctl">
    <button id="bB" class="pb" aria-label="Spara">B<small>FUOCO</small></button>
    <button id="bA" class="pb" aria-label="Salta">A<small>SALTO</small></button>
  </div>
  <div id="top">
    <button id="bWeap" class="tb dbg" aria-label="Cambia arma (debug)" hidden>W</button>
    <button id="bWarp" class="tb dbg" aria-label="Salta avanti (debug)" hidden>&raquo;</button>
    <button id="bFs" class="tb" aria-label="Schermo intero"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 6V1h5M10 1h5v5M15 10v5h-5M6 15H1v-5"/></svg></button>
    <button id="bMute" class="tb" aria-label="Audio on/off" aria-pressed="false">&#9834;</button>
    <button id="bPause" class="tb" aria-label="Pausa">II</button>
  </div>
</div>

<script>
(() => {
'use strict';
let W = 384;
const H = 216, WATER = 196, G = 0.21, LEVEL_W = 3600, WALL_X = 3470;
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
const PX = '"Press Start 2P", ui-monospace, monospace';
const rnd = Math.random;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- level ---------------- */
// [x, top, width, kind]  g = cliff down to the water (solid sides), f = floating ledge (one-way)
const PL = [
  [0,160,560,'g'], [210,112,120,'f'], [380,64,100,'f'],
  [752,160,420,'g'], [820,112,150,'f'], [1010,64,120,'f'],
  [1172,112,200,'g'], [1372,160,130,'g'], [1535,168,48,'f'],
  [1620,160,380,'g'], [1680,112,140,'f'], [1840,64,110,'f'],
  [2192,160,240,'g'], [2250,112,120,'f'],
  [2432,112,220,'g'], [2480,64,120,'f'],
  [2652,160,200,'g'], [2880,170,40,'f'],
  [2960,160,640,'g'], [3040,112,140,'f'], [3220,64,100,'f'], [3470,52,130,'f']
].map(a => ({x:a[0], y:a[1], w:a[2], k:a[3]}));
const BRIDGES = [{x:560, n:6}, {x:2000, n:6}];
const SPAWNS = [
  {x:270,t:'rifle',y:112}, {x:470,t:'bush',y:160}, {x:250,t:'cap',y:70,item:'M'},
  {x:880,t:'rifle',y:112}, {x:1060,t:'rifle',y:64}, {x:850,t:'cap',y:60,item:'S'},
  {x:1186,t:'turret',y:136}, {x:1330,t:'bush',y:112},
  {x:1760,t:'pill',y:160,item:'L'}, {x:1750,t:'rifle',y:112}, {x:1890,t:'rifle',y:64},
  {x:1700,t:'cap',y:70,item:'B'},
  {x:2300,t:'rifle',y:112}, {x:2446,t:'turret',y:136}, {x:2560,t:'rifle',y:64},
  {x:2760,t:'bush',y:160}, {x:2500,t:'cap',y:60,item:'R'},
  {x:3100,t:'pill',y:160,item:'S'}, {x:3100,t:'rifle',y:112}, {x:3260,t:'rifle',y:64},
  {x:3470,t:'core'}, {x:3470,t:'cannon',y:88}, {x:3470,t:'cannon',y:106},
  {x:3500,t:'rifle',y:52,boss:true}
];

/* ---------------- palettes ---------------- */
const HERO = {skin:'#f2b27a', shirt:'#e39a62', pants:'#2f5bd8', boot:'#1b2a6b', belt:'#1b2a6b', hair:'#2a1a10', band:'#e8402a', gun:'#dfe3ea'};
const GREY = {skin:'#e8a87c', shirt:'#8b93a7', pants:'#4b5266', boot:'#22252e', belt:'#22252e', helmet:'#5f6b4e', gun:'#cfd3dc'};
const REDS = {skin:'#e8a87c', shirt:'#b5473a', pants:'#4b3a36', boot:'#22252e', belt:'#22252e', helmet:'#3b3f4a', gun:'#cfd3dc'};

/* ---------------- audio ---------------- */
let AC = null, MG = null, NB = null, mStep = 0, mNext = 0;
let muted = false;
try { muted = localStorage.getItem('fg-muted') === '1'; } catch (e) {}
const mf = n => 440 * Math.pow(2, (n - 69) / 12);
function gesture() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      MG = AC.createGain(); MG.gain.value = muted ? 0 : 0.5; MG.connect(AC.destination);
      NB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = NB.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      mNext = AC.currentTime + 0.1;
      setInterval(sched, 25);
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function osc(type, f0, f1, dur, vol, t0) {
  if (!AC) return;
  const t = t0 || AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g).connect(MG); o.start(t); o.stop(t + dur + 0.03);
}
function nz(dur, vol, freq, t0) {
  if (!AC) return;
  const t = t0 || AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = NB;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(freq, t);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  s.connect(f).connect(g).connect(MG); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.03);
}
const sfx = {
  shot: () => osc('square', 1100, 380, 0.07, 0.07),
  spread: () => osc('square', 700, 220, 0.09, 0.08),
  laser: () => osc('sawtooth', 2200, 180, 0.22, 0.07),
  hit: () => nz(0.05, 0.15, 4000),
  boom: () => { nz(0.35, 0.4, 900); osc('triangle', 140, 40, 0.3, 0.25); },
  big: () => { nz(0.9, 0.5, 600); osc('triangle', 90, 30, 0.8, 0.3); },
  eshot: () => osc('square', 500, 250, 0.05, 0.03),
  splash: () => nz(0.2, 0.12, 1800),
  die: () => osc('square', 700, 60, 0.6, 0.12),
  power: () => { if (!AC) return; [0, 4, 7, 12].forEach((n, i) => osc('square', 523 * Math.pow(2, n / 12), 0, 0.09, 0.08, AC.currentTime + i * 0.07)); },
  fanfare: () => { if (!AC) return; [0, 4, 7, 12, 7, 12, 16].forEach((n, i) => osc('square', 392 * Math.pow(2, n / 12), 0, 0.16, 0.08, AC.currentTime + i * 0.13)); }
};
// original 4-bar loop in A minor: Am - G - F - E
const MEL = [[0,76,2],[2,81,2],[4,84,2],[6,83,1],[7,81,1],[8,76,4],[12,79,2],[14,81,2],
  [16,83,3],[19,81,1],[20,79,2],[22,74,2],[24,79,4],[28,81,2],[30,83,2],
  [32,84,3],[35,83,1],[36,81,2],[38,77,2],[40,81,4],[44,84,2],[46,86,2],
  [48,88,4],[52,86,2],[54,84,2],[56,83,4],[60,80,4]];
const MELMAP = {}; MEL.forEach(m => MELMAP[m[0]] = m);
const ROOT = [45, 43, 41, 40], BASS_STEPS = [0,2,3,6,8,10,11,14];
function sched() {
  if (!AC) return;
  const sd = 60 / 150 / 4;
  if (mNext < AC.currentTime) mNext = AC.currentTime + 0.05;
  while (mNext < AC.currentTime + 0.15) {
    if (!muted && (state === 'play' || state === 'title')) {
      const s = mStep, bar = s >> 4, i = s & 15;
      if (BASS_STEPS.includes(i)) osc('triangle', mf(ROOT[bar] + (i === 3 || i === 11 ? 12 : 0)), 0, sd * 1.6, 0.22, mNext);
      const m = MELMAP[s];
      if (m && state === 'play') osc('square', mf(m[1]), 0, sd * m[2] * 0.95, 0.045, mNext);
      if (i % 2 === 1) nz(0.03, 0.04, 8000, mNext);
      if (i % 8 === 4) nz(0.08, 0.08, 1500, mNext);
    }
    mStep = (mStep + 1) % 64; mNext += sd;
  }
}

/* ---------------- input ---------------- */
const keys = {};
const touch = {l:0, r:0, u:0, d:0, jump:0, fire:0};
const inp = {l:0, r:0, u:0, d:0, jump:0, fire:0, jumpE:0, fireE:0};
let prevJ = 0, prevF = 0, prevDir = {l:0, r:0, u:0, d:0}, tapped = false;
const dirEdges = [];
function readInput() {
  const k = keys;
  inp.l = !!(k.ArrowLeft || k.KeyA || touch.l);
  inp.r = !!(k.ArrowRight || k.KeyD || touch.r);
  inp.u = !!(k.ArrowUp || k.KeyW || touch.u);
  inp.d = !!(k.ArrowDown || k.KeyS || touch.d);
  inp.jump = !!(k.KeyZ || k.KeyK || k.Space || touch.jump);
  inp.fire = !!(k.KeyX || k.KeyJ || touch.fire);
  inp.jumpE = inp.jump && !prevJ; inp.fireE = inp.fire && !prevF;
  prevJ = inp.jump; prevF = inp.fire;
  for (const c of 'lrud') { inp[c + 'E'] = inp[c] && !prevDir[c]; if (inp[c + 'E']) dirEdges.push(c.toUpperCase()); prevDir[c] = inp[c]; }
  if (dirEdges.length > 12) dirEdges.splice(0, dirEdges.length - 12);
}
addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  if (!keys[e.code] && (e.code === 'Enter' || e.code === 'KeyP' || e.code === 'Escape')) {
    if (state === 'play' || state === 'pause') togglePause(); else tapped = true;
  }
  if (!keys[e.code]) {
    if (e.code === 'KeyF') toggleFullscreen();
    if (e.code === 'KeyC') cycleWeapon();
    if (e.code === 'KeyV') warp();
  }
  keys[e.code] = true; gesture();
  document.body.classList.remove('touch');
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.addEventListener('contextmenu', e => e.preventDefault());

const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
if (isTouch) document.body.classList.add('touch');
addEventListener('touchstart', () => document.body.classList.add('touch'), {passive:true});

const pad = $('pad'), stick = $('stick'), knob = $('knob');
let stickId = null, sx0 = 0, sy0 = 0;
function restStick() {
  stick.style.left = '96px';
  stick.style.top = Math.max(70, pad.clientHeight - 96) + 'px';
}
function moveStick(e) {
  let dx = e.clientX - sx0, dy = e.clientY - sy0;
  const d = Math.hypot(dx, dy), max = 44;
  if (d > max * 1.5) { sx0 += dx * (1 - max * 1.5 / d); sy0 += dy * (1 - max * 1.5 / d); }
  const k = d > max ? max / d : 1;
  knob.style.transform = `translate(${dx * k}px,${dy * k}px)`;
  touch.l = touch.r = touch.u = touch.d = 0;
  if (d < 12) return;
  const sec = Math.round(Math.atan2(dy, dx) / (Math.PI / 4));
  const map = {'0':'r', '1':'rd', '2':'d', '3':'ld', '4':'l', '-4':'l', '-3':'lu', '-2':'u', '-1':'ru'};
  for (const c of map[sec]) touch[c] = 1;
}
pad.addEventListener('pointerdown', e => {
  e.preventDefault(); gesture(); autoFs(e);
  if (stickId !== null) return;
  stickId = e.pointerId; pad.setPointerCapture(e.pointerId);
  const r = pad.getBoundingClientRect();
  sx0 = e.clientX; sy0 = e.clientY;
  stick.style.left = (e.clientX - r.left) + 'px'; stick.style.top = (e.clientY - r.top) + 'px';
  moveStick(e);
});
pad.addEventListener('pointermove', e => { if (e.pointerId === stickId) moveStick(e); });
const endStick = e => {
  if (e.pointerId !== stickId) return;
  stickId = null; touch.l = touch.r = touch.u = touch.d = 0;
  knob.style.transform = ''; restStick();
};
pad.addEventListener('pointerup', endStick);
pad.addEventListener('pointercancel', endStick);
function holdBtn(el, key) {
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); gesture(); autoFs(e);
    el.setPointerCapture(e.pointerId); touch[key] = 1; el.classList.add('on');
  });
  const up = () => { touch[key] = 0; el.classList.remove('on'); };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('lostpointercapture', up);
}
holdBtn($('bB'), 'fire');
holdBtn($('bA'), 'jump');
cv.addEventListener('pointerdown', e => {
  gesture(); autoFs(e); tapped = true;
  const r = cv.getBoundingClientRect(); tapY = (e.clientY - r.top) / r.height * H;
});
// fullscreen: automatic on the first touch from the title screen, toggle with the button or F
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
const fsReq = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
function goFullscreen() {
  if (fsEl() || !fsReq) return;
  try {
    const r = fsReq.call(document.documentElement, {navigationUI:'hide'});
    if (r && r.then) r.then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} }).catch(() => {});
  } catch (e) {}
}
function toggleFullscreen() {
  if (fsEl()) { const x = document.exitFullscreen || document.webkitExitFullscreen; if (x) x.call(document); }
  else goFullscreen();
}
function autoFs(e) { if (e.pointerType === 'touch' && (state === 'title' || state === 'over')) goFullscreen(); }
if (!fsReq) $('bFs').hidden = true;
$('bFs').addEventListener('click', () => { gesture(); toggleFullscreen(); });
document.addEventListener('fullscreenchange', () => setTimeout(fit, 60));
document.addEventListener('webkitfullscreenchange', () => setTimeout(fit, 60));
// debug tools, god mode only
function cycleWeapon() {
  if (!god || state !== 'play' || p.dead) return;
  const L = ['N', 'M', 'S', 'L']; p.w = L[(L.indexOf(p.w) + 1) % L.length]; sfx.power();
}
function warp() {
  if (!god || state !== 'play' || p.dead || bossOn) return;
  cam.x = Math.min(cam.x + 400, LEVEL_W - W);
  p.x = cam.x + 150; p.y = -20; p.vy = 0; p.mode = 'air'; p.jumping = false; p.on = null; pb = []; eb = [];
}
$('bWeap').addEventListener('click', cycleWeapon);
$('bWarp').addEventListener('click', warp);
document.querySelectorAll('.tb').forEach(b => b.addEventListener('click', () => b.blur()));
$('bPause').addEventListener('click', () => { gesture(); togglePause(); });
const bMute = $('bMute');
function setMute(m) {
  muted = m; bMute.setAttribute('aria-pressed', String(m));
  if (MG) MG.gain.value = m ? 0 : 0.5;
  try { localStorage.setItem('fg-muted', m ? '1' : '0'); } catch (e) {}
}
setMute(muted);
bMute.addEventListener('click', () => { gesture(); setMute(!muted); });
function togglePause() {
  if (state === 'play') state = 'pause';
  else if (state === 'pause') state = 'play';
}
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'pause'; });

/* ---------------- world state ---------------- */
let state = 'title', frame = 0, stateT = 0;
let p, cam, ents, pb, eb, fx, items, segs, ALLP, spawnList, scars;
let score = 0, lives = 2, loop = 0, nextLife = 20000, spawnT = 120;
let bossOn = false, bossDead = false, clearT = 0, bossSnipT = 0, bannerT = 0, shakeT = 0;
let konami = false, kArmed = 0, msgT = 0;
let god = false, menuSel = 0, tapY = 0, fps = 60;
let hiscore = 20000;
try { hiscore = Math.max(hiscore, +localStorage.getItem('fg-hi') || 0); } catch (e) {}
const diff = () => 1 + loop * 0.3;

function newPlayer(x, y) {
  return {x, y, vx:0, vy:0, mode:'ground', facing:1, jumping:false, prone:false, dive:false, on:null,
    inv:120, w:'N', rapid:false, cd:0, dropT:0, dropP:null, anim:0, dead:false, deadT:0, barrier:0, aim:[1,0]};
}
function startStage() {
  cam = {x:0}; ents = []; pb = []; eb = []; fx = []; items = []; scars = [];
  spawnT = 120; bossOn = false; bossDead = false; clearT = 0; bossSnipT = 0; bannerT = 150;
  segs = [];
  for (const b of BRIDGES) {
    b.on = false;
    for (let i = 0; i < b.n; i++) segs.push({x:b.x + i * 32, y:160, w:32, k:'b', alive:true, g:b, i});
  }
  ALLP = PL.concat(segs);
  spawnList = SPAWNS.map(s => Object.assign({done:false}, s));
  p = newPlayer(40, 160);
}
function newGame(extraLives, godMode) {
  god = godMode; $('bWeap').hidden = $('bWarp').hidden = !god;
  score = 0; lives = extraLives; loop = 0; nextLife = 20000;
  startStage(); state = 'play'; stateT = 0;
  try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
}
function saveHi() {
  if (!god && score > hiscore) { hiscore = score; try { localStorage.setItem('fg-hi', String(hiscore)); } catch (e) {} }
}

/* ---------------- physics helpers ---------------- */
function supportAt(x, y) {
  for (const q of ALLP) {
    if (q.alive === false) continue;
    if (Math.abs(q.y - y) < 0.5 && x >= q.x - 1 && x <= q.x + q.w + 1) return q;
  }
  return null;
}
function landOn(x, y0, y1, skip) {
  let best = null;
  for (const q of ALLP) {
    if (q.alive === false || q === skip) continue;
    if (x >= q.x && x <= q.x + q.w && y0 <= q.y + 0.01 && y1 >= q.y && (!best || q.y < best.y)) best = q;
  }
  return best;
}
function sidePush(o, hw, prevX) {
  for (const q of PL) {
    if (q.k !== 'g') continue;
    if (o.y - 1 > q.y && o.x + hw > q.x && o.x - hw < q.x + q.w) {
      o.x = prevX < q.x + q.w / 2 ? q.x - hw : q.x + q.w + hw;
      return true;
    }
  }

  hud();

  if (state === 'pause') { overlay(0.55); txt('PAUSA', W / 2, 90, '#f4efe1', 'center', 16); txt(touchUI ? 'TOCCA II PER RIPRENDERE' : 'P PER RIPRENDERE', W / 2, 116, '#9fb0c8', 'center'); }
  if (state === 'over') {
    overlay(0.6);
    txt('GAME OVER', W / 2, 74, '#e8402a', 'center', 16);
    txt('PUNTI ' + String(score).padStart(7, '0'), W / 2, 100, '#f4efe1', 'center');
    if (stateT > 60 && blink()) txt(touchUI ? 'B: CONTINUA' : 'X: CONTINUA', W / 2, 126, '#ffcf4a', 'center');
  }
  if (state === 'clear') {
    overlay(0.55);
    txt('MISSIONE', W / 2, 60, '#ffcf4a', 'center', 16);
    txt('COMPIUTA', W / 2, 82, '#ffcf4a', 'center', 16);
    txt('BONUS 5000', W / 2, 110, '#f4efe1', 'center');
    txt('PUNTI ' + String(score).padStart(7, '0'), W / 2, 124, '#f4efe1', 'center');
    if (stateT > 90 && blink()) txt(touchUI ? 'B: PROSSIMO GIRO' : 'X: PROSSIMO GIRO', W / 2, 150, '#9fb0c8', 'center');
  }
}

/* ---------------- sizing + loop ---------------- */
function fit() {
  const app = $('app'), cs = getComputedStyle(app);
  const aw = app.clientWidth, ah = app.clientHeight - parseFloat(cs.paddingTop);
  const portrait = ah > aw;
  const nw = portrait ? 384 : Math.max(384, Math.min(512, Math.round(H * aw / ah)));
  if (nw !== W) { W = nw; cv.width = W; SKY = mkSky(); if (cam) cam.x = Math.min(cam.x, LEVEL_W - W); if (segs) draw(); }
  const s = Math.min(aw / W, (portrait ? ah * 0.5 : ah) / H);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
  restStick();
}
addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 200));
fit();

startStage(); state = 'title';
let acc = 0, last = 0, fpsN = 0, fpsT = 0;
function tick(ts) {
  requestAnimationFrame(tick);
  if (!last) last = ts;
  acc += Math.min(100, ts - last); last = ts;
  fpsN++; if (ts - fpsT >= 1000) { fps = fpsN; fpsN = 0; fpsT = ts; }
  let n = 0;
  while (acc >= 1000 / 60 && n < 5) { step(); acc -= 1000 / 60; n++; }
  draw();
}
if (document.fonts && document.fonts.load) document.fonts.load('8px "Press Start 2P"').catch(() => {});
requestAnimationFrame(tick);
})();
</script>
