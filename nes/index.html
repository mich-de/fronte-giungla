<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NES Tascabile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* Layout: landscape = screen full height, controls float on the sides; portrait = screen on top, pad below */
:root{
  --bg:#0b0b10; --ink:#eceae4; --dim:#8c8f9c; --red:#d8322a; --grey:#3a3c46;
  --glass:rgba(236,234,228,.10); --line:rgba(236,234,228,.28);
  --px:"Press Start 2P", ui-monospace, monospace;
  color-scheme:dark;
}
html{height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--px);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#app{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
#screen{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
@media (orientation:portrait){ #app{justify-content:flex-start;padding-top:9vh} }

#pad{position:absolute;left:0;bottom:0;width:50%;height:72%;z-index:2;touch-action:none}
#stick{position:absolute;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;border:2px solid var(--line);background:var(--glass);pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(236,234,228,.28);border:2px solid rgba(236,234,228,.45)}
#ab{position:absolute;z-index:3;display:flex;gap:14px;align-items:flex-end;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.pb{width:76px;height:76px;border-radius:50%;border:2px solid var(--line);background:rgba(216,50,42,.30);color:var(--ink);font:16px/1 var(--px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;touch-action:none;padding:0}
.pb small{font-size:6px;letter-spacing:.1em;opacity:.8}
.pb.on{background:rgba(216,50,42,.66);transform:scale(.94)}
#bA{margin-bottom:40px}
#ss{position:absolute;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:12px}
.sb{height:26px;padding:0 12px;border-radius:13px;border:1px solid var(--line);background:rgba(58,60,70,.7);color:var(--ink);font:7px/1 var(--px);letter-spacing:.08em;touch-action:none}
.sb.on{background:rgba(236,234,228,.35)}
#top{position:absolute;z-index:4;top:calc(8px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));display:flex;gap:6px}
.tb{min-width:40px;height:36px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:rgba(11,11,16,.6);color:var(--ink);font:8px/1 var(--px)}
.tb[aria-pressed="true"]{color:#ffd23a;border-color:rgba(255,210,58,.6)}
.tb svg{display:block;margin:auto}
#toast{position:absolute;z-index:6;left:50%;top:calc(54px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:rgba(11,11,16,.85);border:1px solid var(--line);padding:8px 12px;border-radius:8px;font-size:8px;white-space:nowrap}

#loader{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 90% at 50% 0%,#1d1e27 0%,var(--bg) 70%);padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
.card{width:100%;max-width:440px;display:flex;flex-direction:column;gap:18px;align-items:stretch;text-align:center}
.logo{font-size:20px;line-height:1.3;letter-spacing:.04em;margin:0;text-wrap:balance}
.logo span{color:var(--red)}
.cart{border:2px solid var(--grey);border-radius:6px 6px 2px 2px;background:linear-gradient(#2a2b33,#1a1b21);padding:14px 12px 12px;display:flex;flex-direction:column;gap:12px}
.label{background:#eceae4;color:#16161b;border-radius:3px;padding:10px 8px;font-size:9px;line-height:1.6;overflow-wrap:anywhere}
.btn{font:10px/1 var(--px);padding:14px 12px;border-radius:6px;border:2px solid var(--line);background:var(--grey);color:var(--ink);letter-spacing:.06em}
.btn.go{background:var(--red);border-color:#f06a5f}
.note{font-size:7px;line-height:1.9;color:var(--dim);margin:0}
#err{color:#ff7a70;font-size:8px;line-height:1.7;margin:0}
button{cursor:pointer}
button:focus-visible{outline:2px solid #ffd23a;outline-offset:2px}
</style>
</head>
<body>
<div id="app">
  <canvas id="screen" width="256" height="240" aria-label="Schermo NES"></canvas>
  <div id="pad"><div id="stick"><div id="knob"></div></div></div>
  <div id="ab">
    <button id="bB" class="pb" aria-label="B">B<small>FUOCO</small></button>
    <button id="bA" class="pb" aria-label="A">A<small>SALTO</small></button>
  </div>
  <div id="ss">
    <button id="bSel" class="sb">SELECT</button>
    <button id="bSta" class="sb">START</button>
  </div>
  <div id="top">
    <button id="bTurbo" class="tb" aria-pressed="false" aria-label="Turbo su B">TB</button>
    <button id="bSave" class="tb" aria-label="Salva stato">SAV</button>
    <button id="bLoad" class="tb" aria-label="Carica stato">LOAD</button>
    <button id="bMute" class="tb" aria-pressed="false" aria-label="Audio on/off">&#9834;</button>
    <button id="bFs" class="tb" aria-label="Schermo intero"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 6V1h5M10 1h5v5M15 10v5h-5M6 15H1v-5"/></svg></button>
    <button id="bEject" class="tb" aria-label="Cambia ROM">&#9167;</button>
  </div>
  <div id="toast" hidden></div>

  <div id="loader">
    <div class="card">
      <h1 class="logo">NES <span>TASCABILE</span></h1>
      <div class="cart">
        <div class="label" id="romLabel">NESSUNA CARTUCCIA</div>
        <button id="bResume" class="btn go" hidden>GIOCA</button>
        <button id="bPick" class="btn">CARICA ROM (.NES / .ZIP)</button>
        <input id="file" type="file" accept=".nes,.zip,application/zip,application/octet-stream" hidden>
      </div>
      <p id="err" hidden></p>
      <p class="note">La ROM resta solo su questo dispositivo: non viene caricata da nessuna parte.<br>Tastiera: frecce, Z = B, X = A, Invio = Start, Shift = Select, F = schermo intero.</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsnes@1.2.1/dist/jsnes.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const SW = 256, SH = 240;
const cv = $('screen'), ctx = cv.getContext('2d');
const img = ctx.createImageData(SW, SH);
const pix = new Uint32Array(img.data.buffer);
const C = jsnes.Controller;

/* ---------- storage (IndexedDB: last ROM + save states) ---------- */
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('nes-tascabile', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function kvGet(k) {
  try { const db = await idb(); return await new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); }
  catch (e) { return undefined; }
}
async function kvSet(k, v) {
  try { const db = await idb(); await new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); return true; }
  catch (e) { return false; }
}

/* ---------- audio ---------- */
let AC = null, muted = false;
try { muted = localStorage.getItem('nes-muted') === '1'; } catch (e) {}
const RING = 16384, ringL = new Float32Array(RING), ringR = new Float32Array(RING);
let wPos = 0, rPos = 0;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const sp = AC.createScriptProcessor(1024, 0, 2);
    sp.onaudioprocess = e => {
      const L = e.outputBuffer.getChannelData(0), Rr = e.outputBuffer.getChannelData(1);
      for (let i = 0; i < L.length; i++) {
        if (rPos !== wPos && !muted) { L[i] = ringL[rPos]; Rr[i] = ringR[rPos]; rPos = (rPos + 1) % RING; }
        else { L[i] = Rr[i] = 0; if (muted) rPos = wPos; }
      }
    };
    sp.connect(AC.destination);
  } catch (e) { AC = null; }
}

/* ---------- emulator ---------- */
let nes = null, romStr = null, romName = '', running = false;
function makeNes() {
  return new jsnes.NES({
    sampleRate: AC ? AC.sampleRate : 44100,
    onFrame: buf => { for (let i = 0; i < SW * SH; i++) pix[i] = 0xFF000000 | buf[i]; },
    onAudioSample: (l, r) => {
      const n = (wPos + 1) % RING;
      if (n === rPos) return;
      ringL[wPos] = l; ringR[wPos] = r; wPos = n;
    }
  });
}
function bytesToStr(u8) {
  let s = '';
  for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192));
  return s;
}
async function unzipFirstNes(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error('Zip non valido');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  for (let n = 0; n < count; n++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const loff = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nlen));
    p += 46 + nlen + xlen + clen;
    if (!/\.nes$/i.test(name)) continue;
    const start = loff + 30 + dv.getUint16(loff + 26, true) + dv.getUint16(loff + 28, true);
    const data = u8.subarray(start, start + csize);
    if (method === 0) return {name, bytes: data.slice()};
    if (method !== 8) throw new Error('Compressione zip non supportata');
    if (typeof DecompressionStream === 'undefined') throw new Error('Il browser non sa aprire gli zip: estrai il file .nes e caricalo');
    const out = await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
    return {name, bytes: new Uint8Array(out)};
  }
  throw new Error('Nello zip non c’è nessun file .nes');
}
async function readRomFile(file) {
  const buf = await file.arrayBuffer();
  const head = new Uint8Array(buf, 0, 4);
  let name = file.name, bytes = new Uint8Array(buf);
  if (head[0] === 0x50 && head[1] === 0x4b) ({name, bytes} = await unzipFirstNes(buf));
  if (!(bytes[0] === 0x4e && bytes[1] === 0x45 && bytes[2] === 0x53 && bytes[3] === 0x1a)) throw new Error('Il file non è una ROM NES (.nes)');
  return {name: name.replace(/\.nes$/i, ''), str: bytesToStr(bytes)};
}
function start() {
  audioInit();
  nes = makeNes();
  try { nes.loadROM(romStr); }
  catch (e) { showErr('ROM non supportata dall’emulatore: ' + e.message); return; }
  $('loader').hidden = true;
  running = true;
  goFullscreen();
  try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
}
function showErr(m) { const e = $('err'); e.textContent = m; e.hidden = !m; }
function setRomLabel() {
  $('romLabel').textContent = romName ? romName.toUpperCase() : 'NESSUNA CARTUCCIA';
  $('bResume').hidden = !romStr;
}
$('bPick').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  showErr('');
  try {
    const r = await readRomFile(f);
    romStr = r.str; romName = r.name; setRomLabel();
    kvSet('rom', {name:romName, str:romStr});
  } catch (err) { showErr(err.message); }
});
$('bResume').addEventListener('click', start);
$('bEject').addEventListener('click', () => { running = false; releaseAll(); $('loader').hidden = false; });

/* ---------- save states ---------- */
let toastT = 0;
function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 1400); }
$('bSave').addEventListener('click', async () => {
  if (!nes || !running) return;
  const s = nes.toJSON(); delete s.romData;
  toast(await kvSet('state:' + romName, s) ? 'STATO SALVATO' : 'SALVATAGGIO NON RIUSCITO');
});
$('bLoad').addEventListener('click', async () => {
  if (!nes || !running) return;
  const s = await kvGet('state:' + romName);
  if (!s) { toast('NESSUN SALVATAGGIO'); return; }
  try { s.romData = romStr; nes.fromJSON(s); toast('STATO CARICATO'); }
  catch (e) { toast('CARICAMENTO NON RIUSCITO'); }
});

/* ---------- input ---------- */
const held = {};          // jsnes button -> pressed
let turbo = false, turboB = false;
function set(btn, down) {
  if (held[btn] === down) return;
  held[btn] = down;
  if (!nes || !running) return;
  if (btn === C.BUTTON_B && turbo) return;   // B is pulsed by the frame loop
  down ? nes.buttonDown(1, btn) : nes.buttonUp(1, btn);
}
function releaseAll() { for (const k in held) set(+k, false); }
const KEYS = {ArrowUp:C.BUTTON_UP, ArrowDown:C.BUTTON_DOWN, ArrowLeft:C.BUTTON_LEFT, ArrowRight:C.BUTTON_RIGHT,
  KeyZ:C.BUTTON_B, KeyX:C.BUTTON_A, Enter:C.BUTTON_START, ShiftLeft:C.BUTTON_SELECT, ShiftRight:C.BUTTON_SELECT};
addEventListener('keydown', e => {
  if (e.code === 'KeyF' && !e.repeat) toggleFullscreen();
  if (KEYS[e.code] !== undefined) { e.preventDefault(); audioInit(); set(KEYS[e.code], true); }
});
addEventListener('keyup', e => { if (KEYS[e.code] !== undefined) set(KEYS[e.code], false); });
addEventListener('blur', releaseAll);
document.addEventListener('contextmenu', e => e.preventDefault());

const pad = $('pad'), stick = $('stick'), knob = $('knob');
let stickId = null, sx0 = 0, sy0 = 0;
function restStick() { stick.style.left = '100px'; stick.style.top = Math.max(74, pad.clientHeight - 100) + 'px'; }
function dirs(u, d, l, r) { set(C.BUTTON_UP, u); set(C.BUTTON_DOWN, d); set(C.BUTTON_LEFT, l); set(C.BUTTON_RIGHT, r); }
function moveStick(e) {
  let dx = e.clientX - sx0, dy = e.clientY - sy0;
  const d = Math.hypot(dx, dy), max = 46;
  if (d > max * 1.5) { sx0 += dx * (1 - max * 1.5 / d); sy0 += dy * (1 - max * 1.5 / d); }
  const k = d > max ? max / d : 1;
  knob.style.transform = `translate(${dx * k}px,${dy * k}px)`;
  if (d < 12) { dirs(false, false, false, false); return; }
  const sec = ((Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) % 8) + 8) % 8;   // 0 = right, clockwise
  dirs(sec >= 5 && sec <= 7, sec >= 1 && sec <= 3, sec >= 3 && sec <= 5, sec === 7 || sec <= 1);
}
pad.addEventListener('pointerdown', e => {
  e.preventDefault(); audioInit();
  if (stickId !== null) return;
  stickId = e.pointerId; pad.setPointerCapture(e.pointerId);
  const r = pad.getBoundingClientRect();
  sx0 = e.clientX; sy0 = e.clientY;
  stick.style.left = (e.clientX - r.left) + 'px'; stick.style.top = (e.clientY - r.top) + 'px';
  moveStick(e);
});
pad.addEventListener('pointermove', e => { if (e.pointerId === stickId) moveStick(e); });
const endStick = e => { if (e.pointerId !== stickId) return; stickId = null; dirs(false, false, false, false); knob.style.transform = ''; restStick(); };
pad.addEventListener('pointerup', endStick);
pad.addEventListener('pointercancel', endStick);
function holdBtn(el, btn) {
  el.addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); el.setPointerCapture(e.pointerId); set(btn, true); el.classList.add('on'); });
  const up = () => { set(btn, false); el.classList.remove('on'); };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('lostpointercapture', up);
}
holdBtn($('bB'), C.BUTTON_B);
holdBtn($('bA'), C.BUTTON_A);
holdBtn($('bSel'), C.BUTTON_SELECT);
holdBtn($('bSta'), C.BUTTON_START);
$('bTurbo').addEventListener('click', () => {
  turbo = !turbo; $('bTurbo').setAttribute('aria-pressed', String(turbo));
  if (nes) nes.buttonUp(1, C.BUTTON_B);
  toast(turbo ? 'TURBO B ATTIVO' : 'TURBO B SPENTO');
});
const bMute = $('bMute');
function setMute(m) { muted = m; bMute.setAttribute('aria-pressed', String(m)); try { localStorage.setItem('nes-muted', m ? '1' : '0'); } catch (e) {} }
setMute(muted);
bMute.addEventListener('click', () => { audioInit(); setMute(!muted); });
document.querySelectorAll('.tb').forEach(b => b.addEventListener('click', () => b.blur()));

/* ---------- fullscreen + sizing ---------- */
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
const fsReq = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
function goFullscreen() {
  if (fsEl() || !fsReq) return;
  try {
    const r = fsReq.call(document.documentElement, {navigationUI:'hide'});
    if (r && r.then) r.then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} }).catch(() => {});
  } catch (e) {}
}
function toggleFullscreen() {
  if (fsEl()) { const x = document.exitFullscreen || document.webkitExitFullscreen; if (x) x.call(document); }
  else goFullscreen();
}
if (!fsReq) $('bFs').hidden = true;
$('bFs').addEventListener('click', toggleFullscreen);
function fit() {
  const app = $('app'), cs = getComputedStyle(app);
  const aw = app.clientWidth, ah = app.clientHeight - parseFloat(cs.paddingTop);
  const portrait = ah > aw;
  const s = Math.min(aw / SW, (portrait ? ah * 0.52 : ah) / SH);
  cv.style.width = Math.floor(SW * s) + 'px';
  cv.style.height = Math.floor(SH * s) + 'px';
  restStick();
}
addEventListener('resize', fit);
document.addEventListener('fullscreenchange', () => setTimeout(fit, 60));
document.addEventListener('webkitfullscreenchange', () => setTimeout(fit, 60));
fit();

/* ---------- main loop: 60 NES frames per second regardless of display rate ---------- */
let acc = 0, last = 0, fcount = 0;
function tick(ts) {
  requestAnimationFrame(tick);
  if (!last) last = ts;
  acc += Math.min(100, ts - last); last = ts;
  if (!running || document.hidden) { acc = 0; return; }
  let n = 0;
  while (acc >= 1000 / 60 && n < 3) {
    if (turbo) { fcount++; (held[C.BUTTON_B] && (fcount & 4)) ? nes.buttonDown(1, C.BUTTON_B) : nes.buttonUp(1, C.BUTTON_B); }
    nes.frame(); acc -= 1000 / 60; n++;
  }
  ctx.putImageData(img, 0, 0);
}
requestAnimationFrame(tick);

ctx.fillStyle = '#000'; ctx.fillRect(0, 0, SW, SH);
kvGet('rom').then(r => { if (r && r.str) { romStr = r.str; romName = r.name; } setRomLabel(); });
})();
</script>
</body>
</html>
