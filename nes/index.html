<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NES Tascabile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* Layout: landscape = screen full height, NES pad floats on the sides; portrait = screen on top, NES pad below.
   With a physical gamepad in use (body.padmode) the touch pad is hidden and the screen takes all the space. */
:root{
  --bg:#0b0b10; --ink:#eceae4; --dim:#8c8f9c; --red:#d8322a; --grey:#3a3c46;
  --glass:rgba(236,234,228,.10); --line:rgba(236,234,228,.28);
  --px:"Press Start 2P", ui-monospace, monospace;
  --cell:clamp(40px,12.5vmin,56px); --btn:clamp(56px,18vmin,80px);
  --shell:#c7c4bc; --face:#121216; --cross-on:#5a5a64;
  color-scheme:dark;
}
html{height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--px);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#app{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
#screen{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
@media (orientation:portrait){ #app{justify-content:flex-start;padding-top:52px} body.padmode #app{justify-content:center;padding-top:0} }

/* ---------- on-screen NES controller ----------
   portrait: the whole pad (grey shell, black faceplate) under the screen, d-pad | select/start | B A
   landscape: the pad splits in two shell halves beside the screen */
#ctl{position:absolute;inset:0;z-index:2;pointer-events:none}
#pad{pointer-events:none}
.half{pointer-events:auto;touch-action:none;display:flex;align-items:center}
body.padmode #ctl{display:none}
.shell{background:var(--face);border:9px solid var(--shell);border-radius:12px;box-shadow:0 0 0 1px #8d8a83,inset 0 0 0 2px #000,0 8px 22px rgba(0,0,0,.55)}
@media (orientation:portrait){
  :root{--cell:min(8.4vw,50px);--btn:min(10.5vw,64px)}
  #ctl{top:auto;height:44%;display:flex;align-items:center;justify-content:center;padding:0 max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));box-sizing:border-box}
  #pad{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:600px;padding:calc(var(--cell)*.35) calc(var(--cell)*.2);box-sizing:border-box}
  .half.shell{background:none;border:0;border-radius:0;box-shadow:none}
  .right{flex:1;justify-content:space-between;gap:calc(var(--cell)*.3)}
  #ss{flex:1}
}
@media (orientation:landscape){
  :root{--cell:min(12.5vh,54px);--btn:min(16.5vh,72px)}
  #pad.shell{background:none;border:0;box-shadow:none}
  .half{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:calc(var(--cell)*.15)}
  .left{left:calc(8px + env(safe-area-inset-left,0px))}
  .right{right:calc(8px + env(safe-area-inset-right,0px));flex-direction:column;gap:6px;padding-top:12px}
  .stripes{display:none}
}

#dpadZone{padding:calc(var(--cell)*.2);touch-action:none}
#dpad{position:relative;width:calc(var(--cell)*3);height:calc(var(--cell)*3);pointer-events:none;filter:drop-shadow(0 3px 0 #000)}
#dpad i{position:absolute;width:var(--cell);height:var(--cell);background:linear-gradient(#36363c,#202024);border:1px solid #44444c;box-sizing:border-box}
#dpad .c{border-color:transparent}
#dpad .u{left:var(--cell);top:0;border-radius:6px 6px 0 0}
#dpad .d{left:var(--cell);top:calc(var(--cell)*2);border-radius:0 0 6px 6px}
#dpad .l{left:0;top:var(--cell);border-radius:6px 0 0 6px}
#dpad .r{left:calc(var(--cell)*2);top:var(--cell);border-radius:0 6px 6px 0}
#dpad .c{left:var(--cell);top:var(--cell)}
#dpad .c::after{content:"";position:absolute;inset:26%;border-radius:50%;background:rgba(0,0,0,.35)}
#dpad i:not(.c)::after{content:"";position:absolute;left:50%;top:50%;width:0;height:0;border:7px solid transparent;margin:-7px}
#dpad .u::after{border-bottom-color:rgba(236,234,228,.35);margin-top:-11px}
#dpad .d::after{border-top-color:rgba(236,234,228,.35);margin-top:-3px}
#dpad .l::after{border-right-color:rgba(236,234,228,.35);margin-left:-11px}
#dpad .r::after{border-left-color:rgba(236,234,228,.35);margin-left:-3px}
#dpad i.on{background:var(--cross-on)}

#ss{display:flex;flex-direction:column;align-items:center;gap:calc(var(--cell)*.18)}
.stripes{width:100%;max-width:150px;height:calc(var(--cell)*.95);background:repeating-linear-gradient(#a7a59f 0 17%,transparent 17% 33%);border-radius:2px}
.ssbox{display:flex;gap:4px;padding:4px 6px 6px;border-radius:8px;background:#bdbab2;box-shadow:inset 0 -2px 0 #8d8a83}
.sb{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 4px 4px;border:0;background:none;color:var(--red);font:5px/1 var(--px);letter-spacing:.06em;touch-action:none}
.sb i{display:block;width:34px;height:12px;border-radius:6px;background:#1a1a1e;box-shadow:0 2px 0 #000}
.sb.on i{transform:translateY(2px);box-shadow:none;background:#3a3a40}

#btns{display:flex;gap:calc(var(--btn)*.2);padding:calc(var(--btn)*.12);touch-action:none}
.fb{display:flex;flex-direction:column;align-items:flex-end;gap:5px;pointer-events:none}
.well{display:flex;align-items:center;justify-content:center;width:calc(var(--btn)*1.18);height:calc(var(--btn)*1.18);border-radius:10px;background:var(--shell);box-shadow:inset 0 2px 4px rgba(0,0,0,.35),0 1px 0 #e8e5de}
.fb b{display:block;width:var(--btn);height:var(--btn);border-radius:50%;background:radial-gradient(circle at 35% 30%,#ec4b45,#b81d24 70%);box-shadow:0 4px 0 #6d0f14,inset 0 -3px 6px rgba(0,0,0,.3)}
.fb.on b{transform:translateY(3px);box-shadow:0 1px 0 #6d0f14;filter:brightness(1.2)}
.lbl{font:11px/1 var(--px);color:var(--red);margin-right:2px}

/* ---------- top bar, toast, loader ---------- */
#top{position:absolute;z-index:4;top:calc(8px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));display:flex;gap:6px}
.tb{min-width:40px;height:36px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:rgba(11,11,16,.6);color:var(--ink);font:8px/1 var(--px)}
.tb[aria-pressed="true"]{color:#ffd23a;border-color:rgba(255,210,58,.6)}
.tb svg{display:block;margin:auto}
#toast{position:absolute;z-index:6;left:50%;top:calc(54px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:rgba(11,11,16,.85);border:1px solid var(--line);padding:8px 12px;border-radius:8px;font-size:8px;white-space:nowrap}

#loader{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 90% at 50% 0%,#1d1e27 0%,var(--bg) 70%);padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
.card{width:100%;max-width:440px;display:flex;flex-direction:column;gap:18px;align-items:stretch;text-align:center}
.logo{font-size:20px;line-height:1.3;letter-spacing:.04em;margin:0;text-wrap:balance}
.logo span{color:var(--red)}
.cart{border:2px solid var(--grey);border-radius:6px 6px 2px 2px;background:linear-gradient(#2a2b33,#1a1b21);padding:14px 12px 12px;display:flex;flex-direction:column;gap:12px}
.label{background:#eceae4;color:#16161b;border-radius:3px;padding:10px 8px;font-size:9px;line-height:1.6;overflow-wrap:anywhere}
.btn{font:10px/1 var(--px);padding:14px 12px;border-radius:6px;border:2px solid var(--line);background:var(--grey);color:var(--ink);letter-spacing:.06em}
.btn.go{background:var(--red);border-color:#f06a5f}
.note{font-size:7px;line-height:1.9;color:var(--dim);margin:0}
#padInfo{color:#ffd23a}
#err{color:#ff7a70;font-size:8px;line-height:1.7;margin:0}
button{cursor:pointer}
button:focus-visible{outline:2px solid #ffd23a;outline-offset:2px}
</style>
</head>
<body>
<div id="app">
  <canvas id="screen" width="256" height="240" aria-label="Schermo NES"></canvas>
  <div id="ctl">
    <div id="pad" class="shell">
      <div class="half left shell">
        <div id="dpadZone" aria-label="Croce direzionale"><div id="dpad"><i class="u"></i><i class="l"></i><i class="c"></i><i class="r"></i><i class="d"></i></div></div>
      </div>
      <div class="half right shell">
        <div id="ss">
          <div class="stripes"></div>
          <div class="ssbox">
            <button id="bSel" class="sb" aria-label="Select">SELECT<i></i></button>
            <button id="bSta" class="sb" aria-label="Start">START<i></i></button>
          </div>
        </div>
        <div id="btns" aria-label="Pulsanti B e A">
          <div id="bB" class="fb"><span class="well"><b></b></span><span class="lbl">B</span></div>
          <div id="bA" class="fb"><span class="well"><b></b></span><span class="lbl">A</span></div>
        </div>
      </div>
    </div>
  </div>
  <div id="top">
    <button id="bSwap" class="tb" aria-pressed="false" aria-label="Scambia A e B sul controller" hidden>A&#8644;B</button>
    <button id="bTurbo" class="tb" aria-pressed="false" aria-label="Turbo su B">TB</button>
    <button id="bSave" class="tb" aria-label="Salva stato">SAV</button>
    <button id="bLoad" class="tb" aria-label="Carica stato">LOAD</button>
    <button id="bMute" class="tb" aria-pressed="false" aria-label="Audio on/off">&#9834;</button>
    <button id="bFs" class="tb" aria-label="Schermo intero"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 6V1h5M10 1h5v5M15 10v5h-5M6 15H1v-5"/></svg></button>
    <button id="bEject" class="tb" aria-label="Cambia ROM">&#9167;</button>
  </div>
  <div id="toast" hidden></div>

  <div id="loader">
    <div class="card">
      <h1 class="logo">NES <span>TASCABILE</span></h1>
      <div class="cart">
        <div class="label" id="romLabel">NESSUNA CARTUCCIA</div>
        <button id="bResume" class="btn go" hidden>GIOCA</button>
        <button id="bPick" class="btn">CARICA ROM (.NES / .ZIP)</button>
        <input id="file" type="file" accept=".nes,.zip,application/zip,application/octet-stream" hidden>
      </div>
      <p id="err" hidden></p>
      <p class="note" id="padInfo" hidden></p>
      <p class="note">La ROM resta solo su questo dispositivo: non viene caricata da nessuna parte.<br>Controller USB/Bluetooth: collegalo e premi un tasto (2 controller = 2 giocatori).<br>Tastiera: frecce, Z = B, X = A, Invio = Start, Shift = Select, F = schermo intero.</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsnes@1.2.1/dist/jsnes.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const SW = 256, SH = 240;
const cv = $('screen'), ctx = cv.getContext('2d');
const img = ctx.createImageData(SW, SH);
const pix = new Uint32Array(img.data.buffer);
const C = jsnes.Controller;
const BTNS = [C.BUTTON_A, C.BUTTON_B, C.BUTTON_SELECT, C.BUTTON_START, C.BUTTON_UP, C.BUTTON_DOWN, C.BUTTON_LEFT, C.BUTTON_RIGHT];

/* ---------- storage (IndexedDB: last ROM + save states) ---------- */
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('nes-tascabile', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function kvGet(k) {
  try { const db = await idb(); return await new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); }
  catch (e) { return undefined; }
}
async function kvSet(k, v) {
  try { const db = await idb(); await new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); return true; }
  catch (e) { return false; }
}
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

/* ---------- audio ---------- */
let AC = null, muted = lsGet('nes-muted') === '1';
const RING = 16384, ringL = new Float32Array(RING), ringR = new Float32Array(RING);
let wPos = 0, rPos = 0;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const sp = AC.createScriptProcessor(1024, 0, 2);
    sp.onaudioprocess = e => {
      const L = e.outputBuffer.getChannelData(0), Rr = e.outputBuffer.getChannelData(1);
      for (let i = 0; i < L.length; i++) {
        if (rPos !== wPos && !muted) { L[i] = ringL[rPos]; Rr[i] = ringR[rPos]; rPos = (rPos + 1) % RING; }
        else { L[i] = Rr[i] = 0; if (muted) rPos = wPos; }
      }
    };
    sp.connect(AC.destination);
  } catch (e) { AC = null; }
}

/* ---------- emulator ---------- */
let nes = null, romStr = null, romName = '', running = false;
function makeNes() {
  return new jsnes.NES({
    sampleRate: AC ? AC.sampleRate : 44100,
    onFrame: buf => { for (let i = 0; i < SW * SH; i++) pix[i] = 0xFF000000 | buf[i]; },
    onAudioSample: (l, r) => {
      const n = (wPos + 1) % RING;
      if (n === rPos) return;
      ringL[wPos] = l; ringR[wPos] = r; wPos = n;
    }
  });
}
function bytesToStr(u8) {
  let s = '';
  for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192));
  return s;
}
async function unzipFirstNes(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error('Zip non valido');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  for (let n = 0; n < count; n++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const loff = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nlen));
    p += 46 + nlen + xlen + clen;
    if (!/\.nes$/i.test(name)) continue;
    const start = loff + 30 + dv.getUint16(loff + 26, true) + dv.getUint16(loff + 28, true);
    const data = u8.subarray(start, start + csize);
    if (method === 0) return {name, bytes: data.slice()};
    if (method !== 8) throw new Error('Compressione zip non supportata');
    if (typeof DecompressionStream === 'undefined') throw new Error('Il browser non sa aprire gli zip: estrai il file .nes e caricalo');
    const out = await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
    return {name, bytes: new Uint8Array(out)};
  }
  throw new Error('Nello zip non c’è nessun file .nes');
}
async function readRomFile(file) {
  const buf = await file.arrayBuffer();
  const head = new Uint8Array(buf, 0, 4);
  let name = file.name, bytes = new Uint8Array(buf);
  if (head[0] === 0x50 && head[1] === 0x4b) ({name, bytes} = await unzipFirstNes(buf));
  if (!(bytes[0] === 0x4e && bytes[1] === 0x45 && bytes[2] === 0x53 && bytes[3] === 0x1a)) throw new Error('Il file non è una ROM NES (.nes)');
  return {name: name.replace(/\.nes$/i, ''), str: bytesToStr(bytes)};
}
function start() {
  if (!romStr) return;
  audioInit();
  nes = makeNes();
  try { nes.loadROM(romStr); }
  catch (e) { showErr('ROM non supportata dall’emulatore: ' + e.message); return; }
  $('loader').hidden = true;
  running = true;
  replayHeld();
  goFullscreen();
  try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
}
function showErr(m) { const e = $('err'); e.textContent = m; e.hidden = !m; }
function setRomLabel() {
  $('romLabel').textContent = romName ? romName.toUpperCase() : 'NESSUNA CARTUCCIA';
  $('bResume').hidden = !romStr;
}
$('bPick').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  showErr('');
  try {
    const r = await readRomFile(f);
    romStr = r.str; romName = r.name; setRomLabel();
    kvSet('rom', {name:romName, str:romStr});
  } catch (err) { showErr(err.message); }
});
$('bResume').addEventListener('click', start);
$('bEject').addEventListener('click', () => { running = false; releaseAll(); $('loader').hidden = false; });

/* ---------- save states ---------- */
let toastT = 0;
function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 1400); }
$('bSave').addEventListener('click', async () => {
  if (!nes || !running) return;
  const s = nes.toJSON(); delete s.romData;
  toast(await kvSet('state:' + romName, s) ? 'STATO SALVATO' : 'SALVATAGGIO NON RIUSCITO');
});
$('bLoad').addEventListener('click', async () => {
  if (!nes || !running) return;
  const s = await kvGet('state:' + romName);
  if (!s) { toast('NESSUN SALVATAGGIO'); return; }
  try { s.romData = romStr; nes.fromJSON(s); toast('STATO CARICATO'); }
  catch (e) { toast('CARICAMENTO NON RIUSCITO'); }
});

/* ---------- input: keyboard, touch pad and gamepads are OR-ed per player ---------- */
const SRC = {KEY:1, TOUCH:2, PAD:4};
const mask = [{}, {}];    // player -> jsnes button -> bitmask of sources holding it
let turbo = false;
const isHeld = (p, btn) => !!mask[p][btn];
function apply(p, btn, down) {
  if (!nes || !running) return;
  if (btn === C.BUTTON_B && turbo) return;   // B is pulsed by the frame loop
  down ? nes.buttonDown(p + 1, btn) : nes.buttonUp(p + 1, btn);
}
function press(p, btn, src, down) {
  const m = mask[p][btn] | 0, n = down ? m | src : m & ~src;
  if (n === m) return;
  mask[p][btn] = n;
  if (!m !== !n) apply(p, btn, !!n);
}
function releaseAll() {
  for (let p = 0; p < 2; p++) for (const b of BTNS) if (mask[p][b]) { mask[p][b] = 0; apply(p, b, false); }
  setDpadView(0, 0, 0, 0); setFaceView(false, false);
}
function replayHeld() { for (let p = 0; p < 2; p++) for (const b of BTNS) if (mask[p][b]) apply(p, b, true); }

const KEYS = {ArrowUp:C.BUTTON_UP, ArrowDown:C.BUTTON_DOWN, ArrowLeft:C.BUTTON_LEFT, ArrowRight:C.BUTTON_RIGHT,
  KeyZ:C.BUTTON_B, KeyX:C.BUTTON_A, Enter:C.BUTTON_START, ShiftLeft:C.BUTTON_SELECT, ShiftRight:C.BUTTON_SELECT};
addEventListener('keydown', e => {
  if (e.code === 'KeyF' && !e.repeat) toggleFullscreen();
  if (KEYS[e.code] !== undefined) { e.preventDefault(); audioInit(); press(0, KEYS[e.code], SRC.KEY, true); }
});
addEventListener('keyup', e => { if (KEYS[e.code] !== undefined) press(0, KEYS[e.code], SRC.KEY, false); });
addEventListener('blur', releaseAll);
document.addEventListener('contextmenu', e => e.preventDefault());

const capture = (el, e) => { try { el.setPointerCapture(e.pointerId); } catch (err) {} };   // pointer may already be gone

/* touch D-pad: one finger, 8 directions from the cross centre, slide freely */
const dz = $('dpadZone'), dp = $('dpad'), arm = {};
for (const k of 'udlr') arm[k] = dp.querySelector('.' + k);
let dpId = null;
function setDpadView(u, d, l, r) { arm.u.classList.toggle('on', !!u); arm.d.classList.toggle('on', !!d); arm.l.classList.toggle('on', !!l); arm.r.classList.toggle('on', !!r); }
function touchDirs(u, d, l, r) {
  press(0, C.BUTTON_UP, SRC.TOUCH, u); press(0, C.BUTTON_DOWN, SRC.TOUCH, d);
  press(0, C.BUTTON_LEFT, SRC.TOUCH, l); press(0, C.BUTTON_RIGHT, SRC.TOUCH, r);
  setDpadView(u, d, l, r);
}
function dpadAt(e) {
  const rc = dp.getBoundingClientRect();
  const dx = e.clientX - (rc.left + rc.width / 2), dy = e.clientY - (rc.top + rc.height / 2);
  if (Math.hypot(dx, dy) < rc.width * 0.12) { touchDirs(false, false, false, false); return; }
  const sec = ((Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) % 8) + 8) % 8;   // 0 = right, clockwise
  touchDirs(sec >= 5 && sec <= 7, sec >= 1 && sec <= 3, sec >= 3 && sec <= 5, sec === 7 || sec <= 1);
}
dz.addEventListener('pointerdown', e => {
  e.preventDefault(); audioInit();
  if (dpId !== null) return;
  dpId = e.pointerId; capture(dz, e); dpadAt(e);
});
dz.addEventListener('pointermove', e => { if (e.pointerId === dpId) dpadAt(e); });
const endDpad = e => { if (e.pointerId !== dpId) return; dpId = null; touchDirs(false, false, false, false); };
dz.addEventListener('pointerup', endDpad);
dz.addEventListener('pointercancel', endDpad);

/* touch B/A: each finger presses whatever button is under it; sliding between them or resting in the gap holds both */
const btnZone = $('btns'), faceEl = {a:$('bA'), b:$('bB')}, fingers = new Map();
function setFaceView(a, b) { faceEl.a.classList.toggle('on', a); faceEl.b.classList.toggle('on', b); }
function faceAt(e) {
  const hit = {};
  for (const k of ['a', 'b']) {
    const rc = faceEl[k].querySelector('b').getBoundingClientRect();
    hit[k] = Math.hypot(e.clientX - (rc.left + rc.width / 2), e.clientY - (rc.top + rc.height / 2)) < rc.width * 0.8;
  }
  return hit;
}
function refreshFace() {
  let a = false, b = false;
  for (const h of fingers.values()) { a = a || h.a; b = b || h.b; }
  press(0, C.BUTTON_A, SRC.TOUCH, a); press(0, C.BUTTON_B, SRC.TOUCH, b);
  setFaceView(a, b);
}
btnZone.addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); capture(btnZone, e); fingers.set(e.pointerId, faceAt(e)); refreshFace(); });
btnZone.addEventListener('pointermove', e => { if (fingers.has(e.pointerId)) { fingers.set(e.pointerId, faceAt(e)); refreshFace(); } });
const endFace = e => { if (fingers.delete(e.pointerId)) refreshFace(); };
btnZone.addEventListener('pointerup', endFace);
btnZone.addEventListener('pointercancel', endFace);

function holdBtn(el, btn) {
  el.addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); capture(el, e); press(0, btn, SRC.TOUCH, true); el.classList.add('on'); });
  const up = () => { press(0, btn, SRC.TOUCH, false); el.classList.remove('on'); };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('lostpointercapture', up);
}
holdBtn($('bSel'), C.BUTTON_SELECT);
holdBtn($('bSta'), C.BUTTON_START);

/* physical gamepads (Gamepad API): 1st connected = player 1, 2nd = player 2.
   Face buttons by position: right/top = A, bottom/left = B (NES layout); A⇄B swaps them. */
let swapAB = lsGet('nes-swapab') === '1', padMode = false, padStartPrev = false;
const bSwap = $('bSwap');
function setSwap(v) { swapAB = v; bSwap.setAttribute('aria-pressed', String(v)); lsSet('nes-swapab', v ? '1' : '0'); }
setSwap(swapAB);
bSwap.addEventListener('click', () => { setSwap(!swapAB); toast(swapAB ? 'A/B SCAMBIATI' : 'A/B NORMALI'); });
function setPadMode(v) {
  if (padMode === v) return;
  padMode = v;
  document.body.classList.toggle('padmode', v);
  if (v) { for (const b of BTNS) press(0, b, SRC.TOUCH, false); fingers.clear(); dpId = null; setDpadView(0, 0, 0, 0); setFaceView(false, false); }
  fit();
}
const connectedPads = () => navigator.getGamepads ? [...navigator.getGamepads()].filter(g => g && g.connected) : [];
function readPad(g) {
  const b = i => !!(g.buttons[i] && g.buttons[i].pressed), ax = i => g.axes[i] || 0;
  let a = b(1) || b(3), bb = b(0) || b(2);
  if (swapAB) [a, bb] = [bb, a];
  return {
    [C.BUTTON_UP]: b(12) || ax(1) < -0.5, [C.BUTTON_DOWN]: b(13) || ax(1) > 0.5,
    [C.BUTTON_LEFT]: b(14) || ax(0) < -0.5, [C.BUTTON_RIGHT]: b(15) || ax(0) > 0.5,
    [C.BUTTON_A]: a, [C.BUTTON_B]: bb, [C.BUTTON_SELECT]: b(8), [C.BUTTON_START]: b(9)
  };
}
function pollPads() {
  const pads = connectedPads();
  let any = false, startNow = false;
  for (let p = 0; p < 2; p++) {
    const st = pads[p] ? readPad(pads[p]) : null;
    for (const b of BTNS) {
      const v = !!(st && st[b]);
      press(p, b, SRC.PAD, v);
      any = any || v;
    }
    if (st && (st[C.BUTTON_START] || st[C.BUTTON_A])) startNow = true;
  }
  if (any && !padMode) setPadMode(true);
  if (startNow && !padStartPrev && !running && romStr && !$('loader').hidden) start();
  padStartPrev = startNow;
}
function padsChanged() {
  const n = connectedPads().length;
  bSwap.hidden = !n;
  const info = $('padInfo');
  info.hidden = !n;
  info.textContent = n ? (n > 1 ? '2 CONTROLLER PRONTI' : 'CONTROLLER PRONTO') + (romStr ? ': START PER GIOCARE' : '') : '';
  if (!n) setPadMode(false);
}
addEventListener('gamepadconnected', e => { padsChanged(); setPadMode(true); toast('CONTROLLER ' + Math.min(2, connectedPads().length) + ' COLLEGATO'); });
addEventListener('gamepaddisconnected', () => { padsChanged(); toast('CONTROLLER SCOLLEGATO'); });
document.addEventListener('pointerdown', e => { if (e.pointerType === 'touch' && padMode) setPadMode(false); }, true);

$('bTurbo').addEventListener('click', () => {
  turbo = !turbo; $('bTurbo').setAttribute('aria-pressed', String(turbo));
  if (nes) { nes.buttonUp(1, C.BUTTON_B); nes.buttonUp(2, C.BUTTON_B); if (!turbo) replayHeld(); }
  toast(turbo ? 'TURBO B ATTIVO' : 'TURBO B SPENTO');
});
const bMute = $('bMute');
function setMute(m) { muted = m; bMute.setAttribute('aria-pressed', String(m)); lsSet('nes-muted', m ? '1' : '0'); }
setMute(muted);
bMute.addEventListener('click', () => { audioInit(); setMute(!muted); });
document.querySelectorAll('.tb').forEach(b => b.addEventListener('click', () => b.blur()));

/* ---------- fullscreen + sizing ---------- */
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
const fsReq = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
function goFullscreen() {
  if (fsEl() || !fsReq) return;
  try {
    const r = fsReq.call(document.documentElement, {navigationUI:'hide'});
    if (r && r.then) r.then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} }).catch(() => {});
  } catch (e) {}
}
function toggleFullscreen() {
  if (fsEl()) { const x = document.exitFullscreen || document.webkitExitFullscreen; if (x) x.call(document); }
  else goFullscreen();
}
if (!fsReq) $('bFs').hidden = true;
$('bFs').addEventListener('click', toggleFullscreen);
function fit() {
  const app = $('app'), cs = getComputedStyle(app);
  const aw = app.clientWidth, h = app.clientHeight;
  const portrait = h > aw;
  const ctlH = portrait && !padMode ? $('ctl').offsetHeight : 0;
  let s = Math.min(aw / SW, (h - parseFloat(cs.paddingTop) - ctlH) / SH);
  if (!portrait && !padMode) {   // shrink the screen (up to 30%) so the pad halves don't cover it
    const side = Math.max(document.querySelector('.left').offsetWidth, document.querySelector('.right').offsetWidth) + 12;
    s = Math.min(s, Math.max(s * 0.7, (aw - 2 * side) / SW));
  }
  cv.style.width = Math.floor(SW * s) + 'px';
  cv.style.height = Math.floor(SH * s) + 'px';
}
addEventListener('resize', fit);
document.addEventListener('fullscreenchange', () => setTimeout(fit, 60));
document.addEventListener('webkitfullscreenchange', () => setTimeout(fit, 60));
fit();

/* ---------- main loop: 60 NES frames per second regardless of display rate ---------- */
let acc = 0, last = 0, fcount = 0;
function tick(ts) {
  requestAnimationFrame(tick);
  pollPads();
  if (!last) last = ts;
  acc += Math.min(100, ts - last); last = ts;
  if (!running || document.hidden) { acc = 0; return; }
  let n = 0;
  while (acc >= 1000 / 60 && n < 3) {
    if (turbo) { fcount++; for (let p = 0; p < 2; p++) (isHeld(p, C.BUTTON_B) && (fcount & 4)) ? nes.buttonDown(p + 1, C.BUTTON_B) : nes.buttonUp(p + 1, C.BUTTON_B); }
    nes.frame(); acc -= 1000 / 60; n++;
  }
  ctx.putImageData(img, 0, 0);
}
requestAnimationFrame(tick);

ctx.fillStyle = '#000'; ctx.fillRect(0, 0, SW, SH);
kvGet('rom').then(r => { if (r && r.str) { romStr = r.str; romName = r.name; } setRomLabel(); padsChanged(); });
})();
</script>
</body>
</html>
